<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MA Distributors Sales Dashboard</title>
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#005eb8">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MA Dashboard">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
--bg:#EDF1F4; --surface:#FFFFFF; --surface2:#F4F7F9; --ink:#101C28; --muted:#526170;
--line:#D9E0E6; --track:#E1E7EC; --pick:#101C28; --pick-fg:#FFFFFF;
--met:#168A55; --met-bg:#DFF2E8; --met-ink:#0D6A3F; --stale:#D92D20; --stale-bg:#FDECEA; --stale-ink:#B42318;
--on:#2A6FD0; --on-bg:#E0EBFA; --on-ink:#1A4F9E;
--behind:#E08E08; --behind-bg:#FCEED3; --behind-ink:#7A4700;
--far:#D2433D; --far-bg:#FAE4E2; --far-ink:#9B2520;
--f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
--f-body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
--f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
--r:18px;
}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]){
--bg:#0C131B; --surface:#141E29; --surface2:#1A2633; --ink:#E7EDF3; --muted:#9BABBA;
--line:#26354A; --track:#263444; --pick:#E7EDF3; --pick-fg:#0C131B;
--met:#3CC084; --met-bg:#123325; --met-ink:#74E2AB; --stale:#F97066; --stale-bg:#3A1613; --stale-ink:#FDA29B;
--on:#5C9DF0; --on-bg:#142845; --on-ink:#93BFFA;
--behind:#F0A53A; --behind-bg:#382909; --behind-ink:#F7C677;
--far:#F2706A; --far-bg:#3B1A19; --far-ink:#FFA29D;
color-scheme:dark;
}
}
:root[data-theme="dark"]{
--bg:#0C131B; --surface:#141E29; --surface2:#1A2633; --ink:#E7EDF3; --muted:#9BABBA;
--line:#26354A; --track:#263444; --pick:#E7EDF3; --pick-fg:#0C131B;
--met:#3CC084; --met-bg:#123325; --met-ink:#74E2AB; --stale:#F97066; --stale-bg:#3A1613; --stale-ink:#FDA29B;
--on:#5C9DF0; --on-bg:#142845; --on-ink:#93BFFA;
--behind:#F0A53A; --behind-bg:#382909; --behind-ink:#F7C677;
--far:#F2706A; --far-bg:#3B1A19; --far-ink:#FFA29D;
color-scheme:dark;
}
*{box-sizing:border-box}
body{
font-family:var(--f-body); font-size:15px; line-height:1.45; background:var(--bg); color:var(--ink);
font-variant-numeric:tabular-nums;
padding-block:20px 48px;
padding-left:max(16px,env(safe-area-inset-left,0px));
padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:1040px;margin:0 auto}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.s-met{--c:var(--met);--cb:var(--met-bg);--ci:var(--met-ink)}
.s-on{--c:var(--on);--cb:var(--on-bg);--ci:var(--on-ink)}
.s-behind{--c:var(--behind);--cb:var(--behind-bg);--ci:var(--behind-ink)}
.s-far{--c:var(--far);--cb:var(--far-bg);--ci:var(--far-ink)}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;padding-bottom:12px}
.eyebrow{font:600 11.5px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font:700 clamp(28px,7.5vw,40px)/1.05 var(--f-display);letter-spacing:-.02em;margin:8px 0 6px;text-wrap:balance}
.sub{margin:0;color:var(--muted)}
.stamp{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding-block:8px 12px;display:flex;gap:8px}
.tab{flex:1;min-width:0;min-height:46px;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border-radius:13px;font-weight:600;text-decoration:none;color:var(--muted);background:var(--surface);border:1px solid var(--line)}
.tab .ic{font-size:18px}
.tab[aria-current="page"]{background:var(--pick);color:var(--pick-fg);border-color:var(--pick)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.stack{display:grid;gap:16px;align-content:start;min-width:0}
@media (min-width:880px){.grid.two{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}}
.sh{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 14px}
h2{font:700 20px/1.15 var(--f-display);letter-spacing:-.01em;margin:0}
h3{font:700 16px/1.2 var(--f-display);margin:0}
.hint{margin:-8px 0 14px;color:var(--muted);font-size:13.5px}
.ring{position:relative;width:var(--sz);height:var(--sz);flex:none}
.ring svg{width:100%;height:100%;display:block}
.rt{fill:none;stroke:var(--track);stroke-width:12}
.rp{fill:none;stroke:var(--c);stroke-width:12;stroke-linecap:round}
.rn{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rn b{font:700 calc(var(--sz) * .27)/1 var(--f-display);color:var(--ci)}
.rn span{font-size:calc(var(--sz) * .085);color:var(--muted);margin-top:4px}
.spill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 10px;border-radius:999px;background:var(--cb);color:var(--ci);font-weight:700;font-size:13.5px}
.hero{display:grid;gap:22px;grid-template-columns:minmax(0,1fr);align-items:center}
.heroL{display:grid;justify-items:center;gap:12px}
@media (min-width:700px){.hero{grid-template-columns:auto minmax(0,1fr);gap:32px}}
.lede{margin:0 0 14px;font-size:16.5px}
.lede b{font-family:var(--f-display);font-size:19px;letter-spacing:-.01em}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:520px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kpi{display:grid;gap:5px;padding:12px 14px;border-radius:14px;background:var(--surface2)}
.kl{display:flex;align-items:center;gap:7px;font:600 10.5px/1.2 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kl .ic{font-size:16px;color:var(--ink)}
.kpi b{font:700 23px/1.1 var(--f-display);letter-spacing:-.01em}
.stat4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:16px}
@media (min-width:640px){.stat4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.st{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"i n" "t t" "r r";align-items:center;column-gap:10px;row-gap:2px;padding:12px;border-radius:14px;background:var(--cb);color:var(--ci);border:2px solid transparent;text-align:left;font:inherit;cursor:pointer;min-height:44px}
.st[aria-pressed="true"]{border-color:var(--c)}
.sti{grid-area:i;display:grid;place-items:center;font-size:22px}
.st .n{grid-area:n;font:700 28px/1 var(--f-display);justify-self:end}
.st .t{grid-area:t;font-weight:700;font-size:13.5px;margin-top:4px}
.st .r{grid-area:r;font-size:12px;opacity:.85}
.hi{display:inline-grid;place-items:center;width:32px;height:32px;margin-right:10px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);color:var(--ink);font-size:18px;vertical-align:middle}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 9px;border-radius:999px;background:var(--on-bg);color:var(--on-ink);font:700 12px/1 var(--f-mono);letter-spacing:.06em}
.chip .ic{font-size:14px}
.pen{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:420px){.pen{grid-template-columns:minmax(0,1fr)}}
.pt{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:var(--surface2);border:1px solid var(--line);border-left:5px solid var(--c)}
.pb{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--cb);color:var(--ci);font-size:25px;flex:none}
.pt small{display:block;font:600 10.5px/1.2 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.pt b{display:block;margin-top:4px;font:700 28px/1.05 var(--f-display);letter-spacing:-.01em}
.pt .pd{display:block;margin-top:3px;font-size:12px;color:var(--muted)}
.alertc{border-color:var(--far)}
.banner{display:flex;align-items:center;gap:10px;margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--cb);color:var(--ci);border:1px solid var(--c);font-weight:600}
.banner .ic{font-size:20px;flex:none}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cw{text-align:center;font:600 10.5px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-bottom:2px}
.cd{display:grid;place-items:center;height:40px;border-radius:11px;font:600 14px/1 var(--f-body);background:var(--surface2);color:var(--muted)}
.cd.empty{background:none}
.cd.past{background:var(--met-bg);color:var(--met-ink)}
.cd.rem{background:var(--on-bg);color:var(--on-ink)}
.cd.today{background:var(--pick);color:var(--pick-fg);box-shadow:0 0 0 3px var(--line)}
.cd.off{background:transparent;border:1px dashed var(--line);color:var(--muted);opacity:.7}
.leg{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:14px;font-size:12.5px;color:var(--muted)}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:13px;height:13px;border-radius:4px;display:inline-block}
.hr{display:grid;justify-items:end;gap:8px}
.mini{width:236px;max-width:100%;padding:10px 12px 11px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.mini .mt{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px;font:700 12.5px/1 var(--f-display)}
.mini .mt span{font:600 10px/1 var(--f-mono);letter-spacing:.04em;color:var(--muted)}
.mini .cal{gap:3px}
.mini .cw{font-size:9px;padding:0}
.mini .cd{height:22px;border-radius:6px;font-size:11px}
.mini .cd.today{box-shadow:0 0 0 2px var(--line)}
.mini .leg{margin-top:8px;gap:3px 9px;font-size:10px}
.mini .leg span{gap:4px}
.mini .leg i{width:9px;height:9px;border-radius:3px}
@media (max-width:560px){.hr{justify-items:start;width:100%}}
.logo{margin:0 0 10px}
.logo img{display:block;height:76px;width:auto;max-width:100%}
@media (max-width:560px){.logo img{height:68px}}
.top{align-items:center;padding:22px 26px;margin:12px 0 6px;border-radius:24px;background:var(--surface);border:1px solid var(--line);gap:18px 28px}
.ttl .stamp{margin-top:14px;background:var(--met-bg);color:var(--met-ink);border-color:var(--met)}
.ttl .stamp.stale{background:var(--stale-bg);color:var(--stale-ink);border-color:var(--stale)}
.stamp{flex-wrap:wrap}
.refbtn{display:inline-flex;align-items:center;gap:6px;margin-left:2px;padding:4px 11px;border-radius:999px;border:1px solid currentColor;background:transparent;color:inherit;font:inherit;font-size:12px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent}
.refbtn[hidden]{display:none}
.refbtn svg{width:14px;height:14px;fill:currentColor;stroke:none}
.stamp.stale .refbtn{background:var(--stale);border-color:var(--stale);color:#fff}
.refbtn.spin svg{animation:refspin .8s linear infinite}
@keyframes refspin{to{transform:rotate(360deg)}}
.credit{margin:10px 0 0 4px;font:600 12px/1.3 var(--f-mono);letter-spacing:.04em;color:var(--muted)}
.credit b{color:var(--ink);font-weight:700}
.mini{background:var(--surface2);border:0;width:250px}
@media (max-width:560px){.top{padding:16px}.hr{justify-items:stretch}.mini{width:100%}}
.hmx{overflow-x:auto;padding-bottom:4px}
.hmg{display:grid;gap:5px;min-width:720px;align-items:center}
.hmg .hh{align-self:end;padding:0 2px 4px;text-align:center;font:600 10px/1.2 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.hmg .hn{display:flex;align-items:center;min-width:0;font-weight:600;font-size:13.5px;color:inherit;text-decoration:none}
.hmg .hn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hmg a.hn:hover{text-decoration:underline}
.hmg .hc{padding:10px 0;border-radius:8px;text-align:center;background:var(--cb);color:var(--ci);font:700 13px/1 var(--f-body)}
.hmg .hc.none{background:var(--surface2);color:var(--muted);font-weight:400}
.hmg .hc.tm{box-shadow:inset 0 0 0 1.5px var(--c)}
.list{display:grid;gap:10px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:12px;row-gap:9px;align-items:center;padding:13px 14px;border-radius:14px;background:var(--surface2);border:1px solid transparent;text-decoration:none;color:inherit}
a.row:hover{border-color:var(--line);background:var(--surface2)}
.bi{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--cb);color:var(--ci);font-size:20px;flex:none}
.sk .bi{width:32px;height:32px;font-size:17px}
.bn{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.bn b{font:700 16.5px/1.2 var(--f-display)}
.bp{display:flex;align-items:center;gap:4px;font:700 22px/1 var(--f-display);color:var(--ci)}
.sk .bp{font-size:19px}
.bp .ic{color:var(--muted);font-size:16px}
.bar{grid-column:1/-1;height:10px;border-radius:999px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--c)}
.bm{grid-column:1/-1;display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.code,.size{font:500 11.5px/1 var(--f-mono);padding:4px 7px;border-radius:6px;color:var(--muted)}
.code{background:var(--surface);border:1px solid var(--line)}
.size{background:var(--track)}
.empty{margin:0;padding:18px;text-align:center;color:var(--muted);background:var(--surface2);border-radius:14px}
.lnk{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px var(--f-body);cursor:pointer}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{font:600 12.5px var(--f-body);min-height:32px;padding:6px 11px;border-radius:8px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pick);color:var(--pick-fg)}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rg{display:grid;gap:8px;padding:14px;border-radius:14px;background:var(--surface2)}
.rg .rh{display:flex;align-items:center;gap:8px;font-weight:700}
.rg .rh .ic{font-size:20px}
.rg .big{font:700 28px/1 var(--f-display);color:var(--ci)}
.rg .bar{grid-column:auto}
.rg small{color:var(--muted);font-size:12.5px}
.gap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.gap:first-of-type{border-top:0;padding-top:0}
.gap .gv{font:700 17px/1 var(--f-display);text-align:right}
.gap .gv small{font:500 11.5px var(--f-body);color:var(--muted);margin-left:4px}
.gap .bar{grid-column:1/2}
.gap .gp{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--ci);background:var(--cb);padding:3px 8px;border-radius:999px;justify-self:end}
.gap .bar.neutral>i{background:var(--ink);opacity:.78}
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;margin-bottom:4px;scroll-snap-type:x proximity}
.pill{flex:none;display:flex;align-items:center;gap:7px;min-height:42px;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);text-decoration:none;font-weight:600;font-size:14px;scroll-snap-align:center}
.pill .ic{color:var(--c);font-size:17px}
.pill[aria-current="true"]{background:var(--pick);color:var(--pick-fg);border-color:var(--pick)}
.head{display:grid;gap:20px;grid-template-columns:minmax(0,1fr);align-items:center}
@media (min-width:700px){.head{grid-template-columns:auto minmax(0,1fr);gap:28px}}
.headL{display:grid;justify-items:center;gap:10px}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.who h2{font-size:26px}
.ghead{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.ghead .ic{font-size:22px}
.ghead span{color:var(--muted);font-size:13px}
.ghead .gpct{margin-left:auto;font:700 15px var(--f-display);color:var(--ci);background:var(--cb);padding:4px 10px;border-radius:999px}
.group+.group{margin-top:22px}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.legend .spill{font-size:12.5px;padding:5px 10px 5px 8px}
.hmw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.hm{border-collapse:separate;border-spacing:0;min-width:820px;width:100%;font-size:13px}
.hm th,.hm td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}
.hm tr:last-child>*{border-bottom:0}
.hm thead th{font:600 10.5px/1.2 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--surface2)}
.hm thead .grp th{font-size:11px;color:var(--ink)}
.hm thead .grp .ic{vertical-align:-3px;margin-right:5px;font-size:14px}
.hm tbody th{text-align:left;position:sticky;left:0;z-index:1;background:var(--surface);font-weight:600;white-space:nowrap;padding-left:12px;padding-right:12px}
.hm thead th:first-child{position:sticky;left:0;z-index:2}
.hm td.c{font-weight:700;background:var(--cb);color:var(--ci);box-shadow:inset 0 0 0 2px var(--surface)}
.hm td.none{color:var(--muted)}
.hm tr.team th,.hm tr.team td{border-bottom:2px solid var(--ink)}
.note{margin:12px 0 0;font-size:12.5px;color:var(--muted)}
.foot{margin:22px 4px 0;font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .5s ease}}
.nt{border-collapse:collapse;width:100%;min-width:320px;font-size:13px}
.nt th,.nt td{padding:8px;text-align:center;border-bottom:1px solid var(--line)}
.nt thead th{font:600 10.5px/1.2 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--surface2)}
.nt tbody th,.nt tfoot th{text-align:left;font-weight:600}
.nt tfoot th,.nt tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
.nt td.p{font-weight:700;background:var(--cb);color:var(--ci)}
.chb{border-radius:14px;background:var(--surface2);margin-top:10px}
.chb summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:9px;align-items:center;padding:13px 14px}
.chb summary::-webkit-details-marker{display:none}
.chb .ic{transition:transform .15s}
.chb[open] summary .ic{transform:rotate(90deg)}
.chd{padding:0 14px 14px}
.stp{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--cb);color:var(--ci);font-weight:700;font-size:12px;white-space:nowrap}
.nt tbody th{white-space:normal}
.nt tbody th a{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.nt tbody th a:hover{text-decoration-color:var(--ink)}
.crd>summary.cr{list-style:none;cursor:pointer;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr) auto 52px 18px}
.crd>summary.cr::-webkit-details-marker{display:none}
.crd{border-top:1px solid var(--line)}
.crd:first-of-type{border-top:0}
.crd>summary.cr{border-top:0}
.crd .ic{transition:transform .15s}
.crd[open]>summary .ic{transform:rotate(90deg)}
.crd>.chd{padding:4px 0 12px}
.crd .code{font-size:10.5px;padding:2px 6px;margin-left:4px}
.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:520px){.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpis.sm{gap:8px}
.kpis.sm .kpi{padding:8px 10px;gap:3px}
.kpis.sm .kpi b{font-size:17px}
.kpis.sm .kl{font-size:9.5px}
@media (max-width:480px){.crd>summary.cr{grid-template-columns:minmax(0,1fr) auto 52px 16px}.crd>summary.cr .bar{grid-column:1/-1;order:9}}
.crd .crd{margin-left:4px}
.crd .crd>summary.cr{padding:5px 2px}
.crd .chd .empty{margin:6px 0}
.zf{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:center;margin:12px 0}
.zf label{font:600 13px var(--f-body);color:var(--muted)}
.zf select{width:100%;min-height:42px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--f-body)}
@media (max-width:480px){.zf{grid-template-columns:minmax(0,1fr)}.zf label{margin-bottom:-4px}}
.rtw{overflow-x:auto}
.rt{width:100%;border-collapse:collapse;font-size:13px}
.rt th,.rt td{padding:8px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
.rt thead th{font:600 10.5px/1.2 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--surface2);white-space:nowrap}
.rt td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rt td.ttl{font-weight:600}
.rt tbody tr:last-child td{border-bottom:0}
@media (max-width:640px){
.rt,.rt tbody,.rt tr,.rt td{display:block;width:100%}
.rt thead{display:none}
.rt tr{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:10px;background:var(--surface)}
.rt td{display:flex;justify-content:space-between;align-items:center;gap:14px;border:0;padding:4px 0;text-align:right}
.rt td::before{content:attr(data-label);flex:none;text-align:left;font:600 10.5px/1.4 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.rt td.ttl{display:block;text-align:left;font-size:14.5px;font-weight:700;padding:2px 0 6px}
.rt td.ttl::before{display:none}
}
.cr{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.5fr) auto 54px;align-items:center;gap:4px 10px;padding:7px 2px;font-size:13px;border-top:1px solid var(--line)}
.cr:first-child{border-top:0}
.cr .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr .bar{height:7px;grid-column:auto}
.cr .am{color:var(--muted);text-align:right;font-size:12.5px;white-space:nowrap}
.cr .pc{text-align:right;font:700 13px var(--f-display);color:var(--ci)}
@media (max-width:480px){.cr{grid-template-columns:minmax(0,1fr) auto 52px}.cr .bar{grid-column:1/-1;order:9}}

${(() => { const x = perDay(b), r = daysLeft(); return x.done ? `<div class="banner s-met">${ic('check')}<span>${b.name} has reached the target.</span></div>` : `<div class="banner s-on">${ic('calendar')}<span>${b.name} needs ${x.txt} per day${r !== null ? ' for the next ' + fmt(r) + ' days' : ''} to reach the target.</span></div>`; })()}
${b.pen && PENT && b.pen.l < PENT.l ? `<div class="banner s-behind">${ic('gauge')}<span>LPPC is ${b.pen.l.toFixed(2)}, below the team average of ${PENT.l.toFixed(2)}.</span></div>` : ''}
${penCard(b.pen, b.name)}${nsCard(b)}${shCard(b)}${chCard(b)}${rnCard(b)}${lwCard(b)}${zCard(b)}
<div class="grid two" style="margin-top:16px">
<section class="card">
<div class="sh">${hd('box', 'All products')}${sortSeg()}</div>
${skuGroups(b.rows)}
</section>
<div class="stack"><section class="card"><div class="sh">${hd('alert', 'Biggest gaps')}</div><p class="hint">Most still to sell for ${b.name}.</p>${gapList(b.rows, 3)}</section>${numCard(b)}</div>
</div>`;
}
function heatmap() {
const fams = FAMS;
const famCell = rows => f => {
const rs = rows.filter(r => r.f.k === f.k);
if (!rs.length) return `<td class="none">&ndash;</td>`;
const t = rs.reduce((s, r) => s + r.t, 0), a = rs.reduce((s, r) => s + r.a, 0);
const pc = Math.round(a / t * 100);
return `<td class="c s-${band(pc)}" title="${f.label}: ${fmt(a)} of ${fmt(t)}">${pc}%</td>`;
};
const liq = fams.filter(f => f.g === 'liq').length, pow = fams.length - liq;
return `<div class="hmw"><table class="hm">
<thead><tr class="grp"><th></th><th colspan="${liq}">${ic('droplet')}Liquids</th><th colspan="${pow}">${ic('jar')}Powders</th></tr>
<tr><th></th>${fams.map(f => `<th>${f.short}</th>`).join('')}</tr></thead>
<tbody><tr class="team"><th scope="row">Team</th>${fams.map(famCell(TEAM.rows)).join('')}</tr>
${BOOKERS.map(b => `<tr><th scope="row">${b.name}</th>${fams.map(famCell(b.rows)).join('')}</tr>`).join('')}
</tbody></table></div>`;
}
function viewProducts() {
if (!TEAM.rows.length) return `<p class="empty">No product data found on the Dashboard sheet.</p>`;
const legend = Object.keys(BANDS).map(k => `<span class="spill s-${k}">${ic(BANDS[k].icon)}${BANDS[k].label} &middot; ${BANDS[k].range}</span>`).join('');
return `<section class="card">
<div class="sh">${hd('box', 'Team products')}${sortSeg()}</div>
<div class="legend">${legend}</div>
<div class="grid" style="grid-template-columns:minmax(0,1fr)">${skuGroups(TEAM.rows)}</div>
</section>
<section class="card" style="margin-top:16px">
<div class="sh">${hd('alert', 'Who is behind on what')}</div>
<p class="hint">Share of target by booker and product family. A dash means the booker has no target for that family.</p>
${heatmap()}
<p class="note">Each cell adds up all pack sizes in the family.</p>
</section>`;
}
function tabs() {
const t = [['overview', 'Overview', 'gauge', '#overview'], ['bookers', 'Bookers', 'users', '#b-' + state.sel], ['products', 'Products', 'box', '#products']];
$('#tabs').innerHTML = t.map(([k, l, i, h]) => `<a class="tab" href="${h}" ${state.view === k ? 'aria-current="page"' : ''}>${ic(i)}<span>${l}</span></a>`).join('');
}
function render() {
tabs();
$('#app').innerHTML = state.view === 'overview' ? viewOverview() : state.view === 'bookers' ? viewBookers() : viewProducts();
const cur = document.querySelector('.pill[aria-current="true"]');
if (cur) { try { cur.scrollIntoView({inline: 'center', block: 'nearest'}); } catch (e) {} }
}
function route() {
state.chAll = false;
state.rnAll = false;
state.lwAll = false;
const h = (location.hash || '#overview').slice(1);
let goto = '';
if (h === 'products') state.view = 'products';
else if (/^b-.+-chiller$/.test(h) && BYID[h.slice(2, -8)]) { state.view = 'bookers'; state.sel = h.slice(2, -8); goto = 'chillerCard'; }
else if (h.indexOf('b-') === 0 && BYID[h.slice(2)]) { state.view = 'bookers'; state.sel = h.slice(2); }
else state.view = 'overview';
render();
const hh = document.querySelector('.top').offsetHeight + 20;
if (window.scrollY > hh) window.scrollTo(0, hh);
if (goto) { const el = document.getElementById(goto); if (el) el.scrollIntoView({block: 'start'}); }
}
document.addEventListener('click', e => {
const b = e.target.closest('[data-act]');
if (!b) return;
const a = b.dataset.act, v = b.dataset.v;
if (a === 'filter') state.filter = state.filter === v ? null : v;
if (a === 'order') state.order = state.order === 'desc' ? 'asc' : 'desc';
if (a === 'sort') state.sort = v;
if (a === 'chall') state.chAll = !state.chAll;
if (a === 'rnall') state.rnAll = !state.rnAll;
if (a === 'lwall') state.lwAll = !state.lwAll;
const sy = window.scrollY;
render();
window.scrollTo(0, sy);
const sel = `[data-act="${a}"]` + (v ? `[data-v="${v}"]` : '');
const again = document.querySelector(sel);
if (again) again.focus({preventScroll: true});
});
document.addEventListener('toggle', e => {
const el = e.target;
if (!el.classList || !el.classList.contains('zd')) return;
state.zopen[el.dataset.k] = el.open;
if (!el.open) return;
const body = el.querySelector('.zb'), z = ZBY[el.dataset.z];
if (!body || body.dataset.done || !z) return;
body.innerHTML = zBody(z, el.dataset.k.charAt(0)); body.dataset.done = '1';
}, true);
document.addEventListener('change', e => {
const t = e.target;
if (!t.dataset || !t.dataset.zf) return;
if (t.dataset.zf === 'b') { state.zf.b = t.value; state.zf.s = ''; } else state.zf.s = t.value;
const sy = window.scrollY, which = t.dataset.zf;
render();
window.scrollTo(0, sy);
const again = document.querySelector('[data-zf="' + which + '"]');
if (again) again.focus({preventScroll: true});
});
$('#subline').textContent = META.month;
$('#stampTxt').textContent = 'Snapshot: ' + META.stamp + (META.lic ? '  |  ' + META.lic : '');
$('#miniCal').innerHTML = miniCal();
(function () {
const diffs = BOOKERS.filter(b => Math.abs(b.rows.reduce((s, r) => s + r.t, 0) - b.tot.t) > 0.05);
let note = '';
if (diffs.length) {
const d = diffs[0];
note = ` Some booker totals differ from the listed products added up (${d.name}: ${fmt(d.tot.t)} against ${fmt(d.rows.reduce((s, r) => s + r.t, 0))}), so some products behind the totals may not be shown.`;
}
$('#foot').textContent = `Source: Dashboard sheet, booker wise performance, Muzammil Team, last updated ${META.updated}. Percentages, balances and per day figures are as printed on the sheet, and totals add up units across pack sizes.` + note;
})();
window.addEventListener('hashchange', route);
route();
(function(){
var btn=document.getElementById('refBtn'),txtEl=document.getElementById('stampTxt'),pill=txtEl.parentNode,okTxt=txtEl.textContent;
if(location.protocol.indexOf('http')!==0||!btn){return;}
btn.hidden=false;
btn.addEventListener('click',function(){btn.classList.add('spin');location.href='index.html?r='+Date.now()+location.hash;});
function setStale(on){pill.classList.toggle('stale',on);txtEl.textContent=on?'New update uploaded - tap Refresh':okTxt;}
function check(){
 if(!navigator.onLine)return;
 fetch('version.txt?nc='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():'';}).then(function(v){
  v=(v||'').trim();
  if(v&&v.length<60&&v.charAt(0)!=='<'){setStale(v!==META.updated);}
 }).catch(function(){});
}
check();
setInterval(check,60000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)check();});
})();
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) { navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body></html>
